<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Optic Access</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; width: 320px; padding: 16px; background: #04060a; color: #e9f0fa;
        font: 13px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        background-image: radial-gradient(80% 60% at 20% -10%, rgba(84,214,255,.16), transparent 70%); }
      header { display: flex; align-items: center; gap: 10px; }
      header svg { width: 30px; height: 30px; filter: drop-shadow(0 0 10px rgba(84,214,255,.5)); }
      h1 { margin: 0; font-size: 15px; font-weight: 600; }
      .sub { font: 500 10px ui-monospace, Menlo, monospace; letter-spacing: .2em; text-transform: uppercase; color: #8fe4ff; }
      .panel { margin-top: 14px; border-radius: 16px; border: 1px solid rgba(233,240,250,.09); background: rgba(10,14,21,.85); }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; }
      .row + .row { border-top: 1px solid rgba(233,240,250,.07); }
      .row b { display: block; font-weight: 600; font-size: 13px; }
      .row span { color: #92a0b6; font-size: 11.5px; }
      .switch { position: relative; flex: none; width: 36px; height: 20px; border-radius: 999px; border: 0; cursor: pointer; background: #151b26; }
      .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #e9f0fa; transition: transform .15s; }
      .switch[aria-checked='true'] { background: #54d6ff; box-shadow: 0 0 14px -4px #54d6ff; }
      .switch[aria-checked='true']::after { transform: translateX(16px); background: #021018; }
      .seg { display: flex; padding: 2px; border-radius: 10px; background: #0f141d; border: 1px solid rgba(233,240,250,.08); }
      .seg button { border: 0; background: none; color: #92a0b6; padding: 5px 9px; border-radius: 8px; cursor: pointer; font: 12px Inter, ui-sans-serif, system-ui, sans-serif; }
      .seg button.on { background: #0a2230; color: #e9f0fa; box-shadow: inset 0 0 0 1px rgba(84,214,255,.3); }
      .owner { font-weight: 600; }
      .muted { color: #5b667a; font-size: 11.5px; }
      .btn { border: 1px solid rgba(233,240,250,.12); background: #0f141d; color: #e9f0fa; border-radius: 10px; padding: 5px 10px; cursor: pointer; font: 12px Inter, ui-sans-serif, system-ui, sans-serif; }
      .btn:hover { border-color: rgba(84,214,255,.5); }
      .pw { margin-top: 14px; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border: 0; border-radius: 16px; cursor: pointer;
        color: #021018; font: 600 15px Inter, ui-sans-serif, system-ui, sans-serif; background: linear-gradient(120deg, #54d6ff, #7a9dff);
        box-shadow: 0 0 0 1px rgba(84,214,255,.6), 0 12px 30px -12px rgba(84,214,255,.8); }
      .pw small { font-weight: 500; font-size: 11.5px; opacity: .75; }
      .pw kbd { font: 11px ui-monospace, Menlo, monospace; }
      a.open { display: block; margin-top: 14px; text-align: center; padding: 10px; border-radius: 12px; color: #e9f0fa; font-weight: 600; text-decoration: none;
        border: 1px solid rgba(233,240,250,.12); background: #0f141d; }
      details { margin-top: 12px; color: #5b667a; font-size: 11.5px; }
      input { width: 100%; margin-top: 6px; padding: 6px 8px; border-radius: 8px; border: 1px solid rgba(233,240,250,.12); background: #0f141d; color: #e9f0fa; font: 12px ui-monospace, Menlo, monospace; }
    </style>
  </head>
  <body>
    <header>
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#54d6ff" />
        <path d="M5.5 16c2.8-4.6 6.3-6.9 10.5-6.9s7.7 2.3 10.5 6.9c-2.8 4.6-6.3 6.9-10.5 6.9S8.3 20.6 5.5 16Z" stroke="#04060a" stroke-width="1.6" />
        <circle cx="16" cy="16" r="3.6" stroke="#04060a" stroke-width="1.6" /><circle cx="16" cy="16" r="1.2" fill="#04060a" />
      </svg>
      <div>
        <h1>Optic Access</h1>
        <div class="sub">Google sign-in guard</div>
      </div>
    </header>

    <button class="pw" id="passwords" type="button">
      <span>🔑 Passwords</span><small>Glance to unlock · <kbd id="kbd">⌘⇧Y</kbd></small>
    </button>

    <div class="panel">
      <div class="row">
        <div><b>Protect Google sign-ins</b><span>Glance before any "Sign in with Google".</span></div>
        <button class="switch" id="enabled" role="switch" aria-checked="true" aria-label="Enabled"></button>
      </div>
      <div class="row">
        <div><b>Mode</b><span id="modeHint"></span></div>
        <div class="seg" id="mode">
          <button data-v="required">Required</button>
          <button data-v="suggest">Suggest</button>
        </div>
      </div>
      <div class="row">
        <div><b>Notice on websites</b><span>Show a hint when a site offers Google sign-in.</span></div>
        <button class="switch" id="notify" role="switch" aria-checked="true" aria-label="Notice on websites"></button>
      </div>
      <div class="row">
        <div><b>Locked to</b><div id="owner" class="muted">Nobody yet: your first glance locks it to you.</div></div>
        <button class="btn" id="reset" hidden>Reset</button>
      </div>
    </div>

    <a class="open secondary" id="open" href="#" target="_blank">Open Optic Access</a>

    <details>
      <summary>Advanced</summary>
      Optic site used for verification
      <input id="url" spellcheck="false" />
    </details>

    <script src="popup.js"></script>
  </body>
</html>
